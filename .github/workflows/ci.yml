name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  docker:
    name: Build and run Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t csv-insights-api .

      - name: Run the container
        run: docker run -d -p 8000:8000 --name csv-api csv-insights-api

      - name: Wait until the container is healthy
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' csv-api)
            echo "Attempt $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          docker logs csv-api
          exit 1

      - name: Call the API
        run: |
          curl -f http://localhost:8000/health
          curl -f -X POST http://localhost:8000/analyze -F "file=@sample_data/sales_sample.csv"

      - name: Stop the container
        if: always()
        run: docker rm -f csv-api
